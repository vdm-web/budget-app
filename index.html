function drag(el,kind){

   const t=document.elementFromPoint(m.clientX,m.clientY),c=t&&t.closest('[data-cat]'),n=kind==='inc'?(t&&t.closest('[data-acc]')):(c&&c.querySelector('.ci'));

  el.onpointerup=el.onpointercancel=u=>{el.onpointermove=el.onpointerup=el.onpointercancel=null;

    if(hot&&u.type==='pointerup'){if(kind==='inc')openSheet('inc',hot.dataset.acc,el.parentElement.dataset.cat);else{const c=hot.parentElement;openSheet(c.dataset.t,el.dataset.acc,c.dataset.cat)}}}}}}
function hist(){
 const {start,end}=periodBounds(histMode,histMonth);
 const tx=S.tx.filter(x=>x.ts>=start&&x.ts<end);
 const selector=`<div class="periodbar">${histMode==='month'?`<button id="hpPrev">‹</button><strong>${monthName(histMonth)}</strong><button id="hpNext">›</button>`:`<strong>${periodLabel(histMode)}</strong>`}<select id="histMode">${[['month','По месяцам'],['3m','3 месяца'],['6m','6 месяцев'],['year','Этот год'],['all','Всё время']].map(([v,l])=>`<option value="${v}" ${histMode===v?'selected':''}>${l}</option>`).join('')}</select></div>`;
 if(!tx.length){$('#v').innerHTML=selector+'<div class="empty">За этот период операций нет.</div>';wireHistPeriod();return}
 const g={};tx.slice().sort((a,b)=>b.ts-a.ts).forEach(x=>{const k=new Date(x.ts).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long',year:'numeric'});(g[k]=g[k]||[]).push(x)});
 $('#v').innerHTML=selector+Object.entries(g).map(([k,l])=>`<div class="day">${k}</div>`+l.map(x=>{const c=find(x.t,x.c);return`<div class="sw" data-id="${x.id}"><div class="d">Удалить</div><div class="rw"><div class="ci">${c.i}</div><div class="t"><b>${esc(c.n)}</b><small>${esc(find('acc',x.a).n)}${x.n?' · '+esc(x.n):''}</small></div><div class="amt ${x.t==='inc'?'p':''}">${x.t==='inc'?'+':'−'}${f(x.m)}</div></div></div>`}).join('')).join('');
 wireHistPeriod();document.querySelectorAll('.sw').forEach(swipe);}

function swipe(w){const r=w.querySelector('.rw');let x0=0,dx=0,on=0;
 r.onpointerdown=e=>{x0=e.clientX;dx=0;on=1;r.style.transition='none';r.setPointerCapture(e.pointerId)};
 r.onpointermove=e=>{if(!on)return;dx=Math.min(0,e.clientX-x0);if(dx<-4)w.classList.add('sp');r.style.transform=`translateX(${dx}px)`};
 r.onpointerup=r.onpointercancel=()=>{on=0;r.style.transition='';if(dx<-90){r.style.transform='translateX(-110%)';setTimeout(()=>{S.tx=S.tx.filter(x=>String(x.id)!==w.dataset.id);save()},180)}else{r.style.transform='';setTimeout(()=>w.classList.remove('sp'),220)}}}
const COL=['#0a84ff','#30d158','#ff9f0a','#bf5af2','#ff453a','#64d2ff','#ffd60a','#ac8e68'];
function stat(){
 const {start,end}=periodBounds(statMode,statMonth);
 const m=S.tx.filter(x=>x.t==='exp'&&x.ts>=start&&x.ts<end),inc=S.tx.filter(x=>x.t==='inc'&&x.ts>=start&&x.ts<end);

/* ---------- sheets ---------- */

function openSheet(t,a,c){sh={t,a,c,e:'',n:'',date:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)};const cat=find(t,c);

 <div class="pad">${['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+'].map(k=>`<button class="${'÷×−+'.includes(k)?'o':''}" data-k="${k}">${k}</button>`).join('')}</div>

 $('#go').onclick=()=>{const v=ev(sh.e);if(!(v>0)){toast('Введите сумму');return}
  const parts=sh.date.split('-').map(Number),ts=new Date(parts[0],parts[1]-1,parts[2],12,0,0,0).getTime();S.tx.push({id:Date.now(),t:sh.t,a:sh.a,c:sh.c,m:v,n:sh.n.trim(),ts});closeOv();save();toast('Сохранено')}}
function setg(){
 $('#v').innerHTML=`<h2>Резервная копия</h2><div class="card" style="padding:14px"><button class="btn" id="exp">Скачать данные (файл)</button><button class="btn g" id="imp">Загрузить данные из файла</button><input type="file" id="file" accept=".json,application/json" hidden><div class="st" id="stt"></div></div>

const ICONS=['💵','💳','🏦','👛','💰','🪙','💼','💻','🎁','📈','🏠','🛒','🍎','🍽️','☕','🍺','🚌','🚗','⛽','🚕','✈️','🏨','🎬','🎮','🎵','📚','🎓','💊','🏥','🦷','👕','👟','💄','✂️','🧴','🐶','🧸','👶','📱','🔌','💡','🧾','🔧','🛠️','🏋️','⚽','🏖️','🎉','🌐','📦','❤️','⭐'];
const NAMES={acc:'счёт',inc:'категория дохода',exp:'категория расхода'};
function sec(t,h){return`<h2>${h}</h2><div class="card" style="padding:12px 14px">`+S[t].map(x=>`<div class="lim er" data-e="${t}:${x.id}"><span>${x.i} ${esc(x.n)}</span><span style="flex:none;color:var(--mut)">›</span></div>`).join('')+`<button class="btn g" data-add="${t}">+ Добавить</button></div>`}

function status(){const e=$('#stt');if(e)e.textContent=S.cfg.last?'Последняя копия: '+new Date(S.cfg.last).toLocaleString('ru-RU'):'Копий ещё не было'}
