<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}

.ci{width:58px;height:58px;border-radius:50%;background:var(--c1);display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform .15s,background .15s,box-shadow .15s}
.ci.w{background:var(--c2);touch-action:none;box-shadow:0 0 0 2px var(--acc)}

.card{background:var(--c1);border-radius:16px;padding:14px;margin-bottom:12px}
.day{color:var(--mut);font-size:13px;margin:18px 6px 8px;font-weight:600}
.sw{position:relative;overflow:hidden;border-radius:12px;margin-bottom:6px;background:var(--red)}
.sw .d{position:absolute;right:20px;top:0;bottom:0;display:flex;align-items:center;color:#fff;font-weight:600}
.rw{position:relative;background:var(--c1);display:flex;align-items:center;gap:12px;padding:10px 12px;touch-action:pan-y;transition:transform .2s}
.rw .ci{width:40px;height:40px;font-size:20px;background:var(--c2)}
.rw div.t{flex:1;min-width:0}.rw div.t b{display:block;font-weight:500}.rw div.t small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600}.amt.p{color:var(--grn)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end}
.ov.on{display:flex}
.sh{width:100%;max-height:92%;overflow-y:auto;background:var(--c1);border-radius:16px 16px 0 0;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}

.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.chip{flex:none;padding:7px 12px;border-radius:12px;background:var(--c2);border:0;color:var(--tx);font-size:14px}.chip.on{background:var(--acc)}

.note,.inp{width:100%;background:var(--c2);border:0;border-radius:12px;color:var(--tx);padding:12px;font-size:16px;margin:6px 0 10px;-webkit-user-select:text;user-select:text}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:54px;border-radius:12px;border:0;background:var(--c2);color:var(--tx);font-size:24px}
.pad button.o{background:#3a3a3c;color:var(--acc)}.pad button:active{filter:brightness(1.4)}
.go{width:100%;height:52px;border-radius:14px;border:0;background:var(--acc);color:#fff;font-size:18px;font-weight:600;margin-top:10px}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:16px;font-weight:600;margin:6px 0}
.btn.g{background:var(--c2)}
.lim{display:flex;align-items:center;gap:10px;margin:6px 0}.lim span{flex:1}.lim input{width:110px;margin:0;text-align:right}
.st{color:var(--mut);font-size:14px;margin:8px 2px}
.leg{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:15px}.leg i{width:10px;height:10px;border-radius:50%}.leg span{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3a3a3c;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 10px}.ic{height:46px;border-radius:12px;border:0;background:var(--c2);font-size:24px}.ic.on{background:var(--acc)}.er{background:var(--c2);border-radius:12px;padding:12px 14px;margin:6px 0}.er span:first-child{flex:1}
.empty{color:var(--mut);text-align:center;padding:50px 20px}

.gear{box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:19px}
nav{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid #d1d1d6}

.ci.hot{background:var(--acc);box-shadow:0 0 0 6px rgba(0,122,255,.25)}
.chip.on{background:var(--acc);color:#fff}.chip{color:var(--tx)}
.btn.g{background:var(--c2);color:var(--acc)}
.pad button.o{background:#e5e5ea}.pad button:active{filter:brightness(.9)}
.pad button{box-shadow:0 1px 0 rgba(0,0,0,.08)}
.grab{background:#d1d1d6}.ov{background:rgba(0,0,0,.35)}
.sh{box-shadow:0 -4px 30px rgba(0,0,0,.12)}

.periodbar.home-periodbar{width:100%;min-width:0;max-width:none;justify-content:space-between;gap:8px;margin:16px auto 0;padding:0 62px;box-sizing:border-box}

.periodbar button{border:0;background:var(--c1);border-radius:10px;padding:8px 12px;font-size:18px;color:var(--acc)}
.periodbar strong{font-size:16px;text-transform:capitalize}

.hero{padding:8px 8px 0}.hero small{color:var(--mut);font-size:13px}.hero b{display:block;font-size:42px;letter-spacing:-1.2px;font-weight:700;margin:2px 0}

.hh{display:flex;justify-content:space-between;align-items:baseline}.hh .p{color:var(--grn);font-size:15px;font-weight:600}.hh .m{color:var(--red);font-size:15px;font-weight:600}

header.abs{position:absolute;top:env(safe-area-inset-top,0px);right:0;padding:10px 16px 0;z-index:5}header.abs h1{display:none}
#app:has(header.abs) .hero{padding-top:12px}
[data-t="inc"] .ci{touch-action:none}
.hh .g{color:var(--tx);font-size:15px;font-weight:600}

html,body{color:#fff;font-family:"Avenir Next Condensed","DIN Condensed","Arial Narrow",ui-rounded,-apple-system,sans-serif}
body{background:radial-gradient(70% 38% at 85% 0%,rgba(255,138,61,.6),transparent 70%),radial-gradient(80% 42% at 0% 18%,rgba(255,45,149,.5),transparent 70%),radial-gradient(90% 40% at 50% 100%,rgba(120,40,200,.45),transparent 70%),linear-gradient(180deg,#14042a,#240a45 60%,#12031f);background-attachment:fixed}
body::before{content:"";position:fixed;left:50%;top:-250px;width:460px;height:460px;margin-left:-230px;border-radius:50%;background:linear-gradient(180deg,#ffd166,#ff5a8a 55%,#b0208f);opacity:.3;-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 15px,transparent 15px 20px);mask-image:repeating-linear-gradient(180deg,#000 0 15px,transparent 15px 20px);pointer-events:none}
#app{position:relative;z-index:1}
h2,.day{color:#ffb3dc;letter-spacing:.2em;font-weight:800;font-size:13px}
header h1{text-transform:uppercase;letter-spacing:.06em;font-weight:900}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);box-shadow:0 22px 50px -24px rgba(255,45,149,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.hero2{background:linear-gradient(135deg,rgba(255,61,154,.38),rgba(255,138,61,.26) 60%,rgba(120,40,200,.3));border:1px solid rgba(255,255,255,.28);box-shadow:0 26px 60px -22px rgba(255,61,154,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.hero2 small{color:#ffd0e8;letter-spacing:.22em;font-weight:800}
.big{color:#fff;font-weight:900;text-shadow:0 0 28px rgba(255,61,154,.85),0 0 4px rgba(255,255,255,.5)}.cur{color:#ffb347}
.it b{color:#fff;font-weight:700;letter-spacing:.02em}.it small{color:#ffc4e4}
.ci{background:rgba(255,255,255,.1)!important;box-shadow:0 0 0 1.5px var(--g,#ff3d9a),0 0 18px -2px var(--g,#ff3d9a)}
.ci::after{background:linear-gradient(150deg,rgba(255,255,255,.35),transparent 55%)}
.it:nth-child(4n+2) .ci{--g:#ff8a3d}.it:nth-child(4n+3) .ci{--g:#2ef2c2}.it:nth-child(4n) .ci{--g:#b46bff}
.ci.hot,.it.tg .ci{box-shadow:0 0 0 3px #fff,0 0 30px 4px var(--g,#ff3d9a)}
.hh .m{background:rgba(255,106,92,.2);color:#ffa89e}.hh .p{background:rgba(46,242,194,.18);color:#2ef2c2}.hh .g{background:rgba(255,255,255,.14);color:#fff}
.periodbar.home-periodbar button,.periodbar:not(.home-periodbar) button{background:rgba(255,255,255,.1);color:#ff8ac4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.periodbar strong,.periodbar select{color:#fff}.periodbar select{background:rgba(255,255,255,.1);color-scheme:dark}
nav{background:rgba(24,6,44,.8);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 40px -14px rgba(255,45,149,.45)}
nav button{color:#c9a6e6}nav button.on{background:linear-gradient(135deg,#ff3d9a,#ff8a3d);color:#fff;box-shadow:0 8px 20px -8px rgba(255,61,154,.9)}
.rw{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.rw .ci{background:rgba(255,255,255,.1)!important;box-shadow:none}
.rw:active{background:rgba(255,255,255,.14)}.rw div.t small{color:#c9a6e6}.amt.p{color:#2ef2c2}.amt.tr{color:#ff8ac4}
.sh{background:#1d0839;box-shadow:0 -20px 60px -10px rgba(255,45,149,.45);border-top:1px solid rgba(255,255,255,.18)}
.ov{background:rgba(10,2,24,.55)}.grab{background:rgba(255,255,255,.25)}
.chip,.er,.btn.g{background:rgba(255,255,255,.1);color:#fff}.btn.g{color:#ff8ac4}
.chip.on,.btn,.go{background:linear-gradient(135deg,#ff3d9a,#ff8a3d);color:#fff;box-shadow:0 14px 28px -12px rgba(255,61,154,.9)}
.note,.inp,.date-input,input[type=date]{background:rgba(255,255,255,.1);color:#fff;color-scheme:dark}.note::placeholder,.inp::placeholder{color:#b894d6}
.pad button{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}.pad button:active{background:rgba(255,255,255,.22)}
.pad button.o{background:rgba(255,61,154,.22);color:#ff8ac4}
.disp{color:#fff;text-shadow:0 0 20px rgba(255,61,154,.7)}
svg text{fill:#fff!important}svg polyline{stroke:#ff3d9a}svg circle[fill="#007aff"]{fill:#ff3d9a}
.toast{background:rgba(255,61,154,.95);color:#fff}
.hero2{position:relative;cursor:pointer;transition:transform .2s}.hero2:active{transform:scale(.985)}
.hero2 .hint{position:absolute;top:20px;right:22px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffd0e8;opacity:.85}
#ov.glassov{align-items:center;justify-content:center;padding:22px;background:rgba(10,2,30,.28);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#ov.glassov .sh{width:100%;max-width:360px;max-height:80%;border-radius:34px;padding:22px 18px 18px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);border:1px solid rgba(255,255,255,.34);box-shadow:0 30px 80px -20px rgba(255,45,149,.6),inset 0 1px 0 rgba(255,255,255,.4);animation:pop .35s cubic-bezier(.2,.9,.3,1.15) both}
#ov.glassov .grab{display:none}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}}
.actl{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#ffd0e8;margin:0 4px}
.actot{font-size:44px;font-weight:900;margin:4px 4px 16px;color:#fff;text-shadow:0 0 24px rgba(255,61,154,.8);font-variant-numeric:tabular-nums}
.acr{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:10px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.acr .ci{width:46px;height:46px;font-size:22px;flex:none}.acr .nm{flex:1;font-size:18px;font-weight:700;color:#fff}.acr .bl{font-size:19px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.actot{font-size:34px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;margin:2px 4px 14px}
.acr{gap:12px;padding:11px 14px}.acr .ci{width:42px;height:42px;font-size:20px}
.acr .nm{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acr .bl{font-size:16px;font-weight:700;white-space:nowrap;letter-spacing:0}
.rub{font-size:.72em;font-weight:700;margin-left:.28em;color:#ffb3dc}
input,select,textarea,.date-input{-webkit-user-select:text;user-select:text}
/* ===== NEW YEAR THEME ===== */
@keyframes snow{to{transform:translateY(240px)}}@keyframes twk{from{opacity:.55}to{opacity:1}}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.tm{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:8px;border-radius:16px;border:1.5px solid transparent;background:rgba(255,255,255,.08);color:#fff;font:700 12.5px -apple-system,sans-serif}.tm i{display:block;width:100%;height:46px;border-radius:12px}.tm.on{border-color:#fff;box-shadow:0 0 22px -4px rgba(255,255,255,.45)}
html[data-theme=ny]{--acc:#e63946;--mut:#bfe3dc;--grn:#5ee6a8;--red:#ff7a7a;--c1:rgba(255,255,255,.07);--c2:rgba(255,255,255,.1)}

function wireReorder(g){

function hist(){

 const g={};tx.slice().sort((a,b)=>b.ts-a.ts).forEach(x=>{const k=new Date(x.ts).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long',year:'numeric'});(g[k]=g[k]||[]).push(x)});
 $('#v').innerHTML=selector+Object.entries(g).map(([k,l])=>`<div class="day">${k}</div>`+l.map(x=>{const c=x.t==='trf'?{i:'⇄',n:'Перевод'}:find(x.t,x.c),sub=esc(find('acc',x.a).n)+(x.t==='trf'?' → '+esc(find('acc',x.c).n):'');return`<div class="sw" data-id="${x.id}"><div class="d">Удалить</div><div class="rw"><div class="ci">${c.i}</div><div class="t"><b>${esc(c.n)}</b><small>${sub}${x.n?' · '+esc(x.n):''}</small></div><div class="amt ${x.t==='inc'?'p':x.t==='trf'?'tr':''}">${x.t==='trf'?'':x.t==='inc'?'+':'−'}${f(x.m)}</div></div></div>`}).join('')).join('');

const COL=['#0a84ff','#30d158','#ff9f0a','#bf5af2','#ff453a','#64d2ff','#ffd60a','#ac8e68'];
function stat(){

 const p=$('#spPrev'),n=$('#spNext');if(p)p.onclick=()=>{statMonth.setMonth(statMonth.getMonth()-1);render()};if(n)n.onclick=()=>{statMonth.setMonth(statMonth.getMonth()+1);render()};

$('#ov').onclick=e=>{if(e.target.id==='ov')closeOv()};
function ev(s){if(!/^[\d.+\-×÷ ]+$/.test(s))return NaN;try{return Math.round(Function('return '+s.replace(/×/g,'*').replace(/÷/g,'/'))()*100)/100}catch(e){return NaN}}
function openSheet(t,a,c,tx){const d0=tx?new Date(tx.ts):new Date(),ds=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0');sh={t,a,c,e:tx?String(tx.m):'',n:tx?(tx.n||''):'',id:tx&&tx.id,fresh:!!tx,date:ds,date0:ds};const cat=t==='trf'?find('acc',c):find(t,c),chp=id=>S.acc.map(x=>`<button class="chip ${x.id===id?'on':''}" data-a="${x.id}">${x.i} ${esc(x.n)}</button>`).join('');
 openOv(`${t==='trf'?'<div class="st" style="margin:0 0 6px">Откуда</div>':''}<div class="chips" id="chips">${chp(a)}</div>${t==='trf'?'<div class="st" style="margin:0 0 6px">Куда</div><div class="chips" id="chips2">'+chp(c)+'</div>':''}
 <div class="st" style="margin:0">${sh.id?'Изменить · ':''}${t==='trf'?'Перевод между счетами':(t==='exp'?'Расход':'Доход')+': '+cat.i+' '+esc(cat.n)}</div><div class="disp" id="disp">0</div>
 <label class="date-label" for="txDate">Дата операции</label><input class="date-input" id="txDate" type="date" value="${sh.date}"><input class="note" id="note" placeholder="Комментарий (необязательно)" maxlength="80">
 <div class="pad">${['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+'].map(k=>`<button class="${'÷×−+'.includes(k)?'o':''}" data-k="${k}">${k}</button>`).join('')}</div>
 <button class="go" id="go">${sh.id?'Сохранить':'Готово'}</button>`);
 $('#chips').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;sh.a=b.dataset.a;$('#chips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))};
 if($('#chips2'))$('#chips2').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;sh.c=b.dataset.a;$('#chips2').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))};
 $('#note').value=sh.n;$('#disp').textContent=sh.e||'0';$('#note').oninput=e=>sh.n=e.target.value;$('#txDate').onchange=e=>sh.date=e.target.value;
 document.querySelectorAll('.pad button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();const k=b.dataset.k;if(sh.fresh){if(/[\d.]/.test(k))sh.e='';sh.fresh=false}sh.e=k==='⌫'?sh.e.slice(0,-1):sh.e+(k==='−'?'-':k);const v=ev(sh.e);$('#disp').innerHTML=(sh.e.replace(/-/g,'−')||'0')+(/[+\-×÷]/.test(sh.e.slice(1))&&!isNaN(v)?` <small>= ${v}</small>`:'')});
 $('#go').onclick=()=>{const v=ev(sh.e);if(!(v>0)){toast('Введите сумму');return}
  if(sh.t==='trf'&&sh.a===sh.c){toast('Выберите разные счета');return}
  sh.date=$('#txDate').value||sh.date;const parts=sh.date.split('-').map(Number),ts=new Date(parts[0],parts[1]-1,parts[2],12,0,0,0).getTime();if(sh.id){const x=S.tx.find(q=>q.id===sh.id);if(x){x.a=sh.a;if(sh.t==='trf')x.c=sh.c;x.m=v;x.n=sh.n.trim();if(sh.date!==sh.date0)x.ts=ts}}else S.tx.push({id:Date.now(),t:sh.t,a:sh.a,c:sh.c,m:v,n:sh.n.trim(),ts});closeOv();save();toast('Сохранено')}}
function setg(){
 const th=S.cfg.theme||'gta';
 $('#v').innerHTML=`<h2>Резервная копия</h2><div class="card" style="padding:14px"><button class="btn" id="exp">Скачать данные (файл)</button><button class="btn g" id="imp">Загрузить данные из файла</button><input type="file" id="file" accept=".json,application/json" hidden><div class="st" id="stt"></div></div>
 ${sec('acc','Счета')}${sec('inc','Категории доходов')}${sec('exp','Категории расходов')}<h2>Тема оформления</h2><div class="card themes"><button class="tm ${th==='classic'?'on':''}" data-th="classic"><i style="background:linear-gradient(135deg,#dbe6ff,#3b82ff 55%,#6a4dff)"></i>Классика</button><button class="tm ${th==='gta'?'on':''}" data-th="gta"><i style="background:linear-gradient(135deg,#ff3d9a,#ff8a3d 55%,#6a1b9a)"></i>Vice City</button><button class="tm ${th==='ny'?'on':''}" data-th="ny"><i class="swny">🎄</i>❄ Новый год</button></div>`;status();
 document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.cfg.theme=b.dataset.th;persist();applyTheme();setg()});
 $('#exp').onclick=exportData;$('#imp').onclick=()=>$('#file').click();$('#file').onchange=importData;
 document.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>{const[t,i]=e.dataset.e.split(':');openEdit(t,i)});
 document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{openEdit(e.dataset.add)})}
const ICONS=['💵','💳','🏦','👛','💰','🪙','💼','💻','🎁','📈','🏠','🛒','🍎','🍽️','☕','🍺','🚌','🚗','⛽','🚕','✈️','🏨','🎬','🎮','🎵','📚','🎓','💊','🏥','🦷','👕','👟','💄','✂️','🧴','🐶','🧸','👶','📱','🔌','💡','🧾','🔧','🛠️','🏋️','⚽','🏖️','🎉','🌐','📦','❤️','⭐'];
const NAMES={acc:'счёт',inc:'категория дохода',exp:'категория расхода'};
function sec(t,h){return`<h2>${h}</h2><div class="card" style="padding:12px 14px">`+S[t].map(x=>`<div class="lim er" data-e="${t}:${x.id}"><span>${x.i} ${esc(x.n)}</span><span style="flex:none;color:var(--mut)">›</span></div>`).join('')+`<button class="btn g" data-add="${t}">+ Добавить</button></div>`}
function openEdit(t,id){const isNew=!id,o=isNew?{id:t+Date.now(),n:'',i:ICONS[0],b:0}:find(t,id);let ic=o.i;
 openOv(`<h2 style="margin-top:0">${isNew?'Новая':'Изменить'}: ${NAMES[t]}</h2><input class="inp" id="en" placeholder="Название" maxlength="20" value="${esc(o.n)}">
 ${t==='acc'?`<div class="st" style="margin:0 0 -4px">Баланс на счёте (как на главной)</div><input class="inp" id="eb" type="number" inputmode="decimal" placeholder="Баланс счёта" value="${isNew?(o.b||0):Math.round(bal(o)*100)/100}">`:''}
 <div class="icons">${ICONS.map(i=>`<button class="ic ${i===ic?'on':''}" data-i="${i}">${i}</button>`).join('')}</div>
 <button class="go" id="es">Сохранить</button>${isNew?'':'<button class="btn g" id="ed" style="color:var(--red)">Удалить</button>'}<button class="btn g" id="ec">Назад</button>`);
 const back=()=>{closeOv();render()};
 document.querySelectorAll('.ic').forEach(b=>b.onclick=()=>{ic=b.dataset.i;document.querySelectorAll('.ic').forEach(x=>x.classList.toggle('on',x===b))});
 $('#ec').onclick=back;
 $('#es').onclick=()=>{const n=$('#en').value.trim();if(!n){toast('Введите название');return}
  const v={id:o.id,n,i:ic};if(t==='acc'){const nv=+$('#eb').value||0;v.b=isNew?nv:Math.round((nv-(bal(o)-(o.b||0)))*100)/100}if(t==='exp'&&o.l)v.l=o.l;
  if(isNew)S[t].push(v);else Object.assign(o,v);save();back()};
 if(!isNew)$('#ed').onclick=()=>{if(t==='acc'&&S.acc.length<2){toast('Нужен хотя бы один счёт');return}
  const k=S.tx.filter(x=>t==='acc'?(x.a===id||(x.t==='trf'&&x.c===id)):x.t===t&&x.c===id).length;
  if(!confirm(`Удалить «${o.n}»${k?` вместе с операциями (${k})`:''}?`))return;
  S[t]=S[t].filter(x=>x.id!==id);S.tx=S.tx.filter(x=>!(t==='acc'?(x.a===id||(x.t==='trf'&&x.c===id)):x.t===t&&x.c===id));save();back()}}
function status(){const e=$('#stt');if(e)e.textContent=S.cfg.last?'Последняя копия: '+new Date(S.cfg.last).toLocaleString('ru-RU'):'Копий ещё не было'}
async function exportData(){const {cfg,...d}=S,blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'}),name='budget_'+new Date().toISOString().slice(0,10)+'.json';
 try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});done();return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();done()}
function done(){S.cfg.last=Date.now();persist();status();toast('Файл сохранён')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.acc)||!d.acc.length||!Array.isArray(d.tx)||!Array.isArray(d.inc)||!Array.isArray(d.exp))throw 0;
  if(!confirm(`Заменить текущие данные данными из файла?\nОпераций в файле: ${d.tx.length}`))return;
  S={...DEF,...d,cfg:S.cfg};persist();closeOv();render();toast('Данные загружены')}catch(x){toast('Не удалось прочитать файл')}};
 r.readAsText(f);e.target.value=''}
/* ---------- init ---------- */
document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;reorder=null;if(tab==='home')spinNext=true;render();$('#v').scrollTop=0});
try{const m={name:'Бюджет',short_name:'Бюджет',display:'standalone',background_color:'#000000',theme_color:'#000000',start_url:location.pathname,lang:'ru',icons:[{src:new URL('icon-512.png',location.href).href,sizes:'512x512',type:'image/png'},{src:new URL('icon-180.png',location.href).href,sizes:'180x180',type:'image/png'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();
window.addEventListener('pageshow',e=>{if(e.persisted&&tab==='home'){spinNext=true;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='home'&&!$('#ov').classList.contains('on')){spinNext=true;render()}});
</script></body></html>
