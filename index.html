<title>Бюджет</title>
<style>
:root{--acc:#ff3d9a;--ink:#fff;--tx:#fff;--mut:#c9a6e6;--grn:#2ef2c2;--red:#ff6a5c;--c1:rgba(255,255,255,.07);--c2:rgba(255,255,255,.1);--k0:#0a84ff;--k1:#30d158;--k2:#ff9f0a;--k3:#bf5af2;--k4:#ff453a;--k5:#64d2ff;--k6:#ffd60a;--k7:#ac8e68;--ch-ink:#fff;--ch-mut:#c9a6e6;--ch-line:rgba(255,255,255,.12);--ch-track:rgba(255,255,255,.1);--ch-row-bg:rgba(255,255,255,.07);--ch-bar-bg:rgba(255,255,255,.14);--ch-center-bg:radial-gradient(circle at 35% 25%,rgba(255,255,255,.14),rgba(255,255,255,.03));--ch-ring-bg:radial-gradient(circle,rgba(255,255,255,0) 0 52%,rgba(255,255,255,.05) 53% 100%);--ch-badge-bg:rgba(255,61,154,.22);--ch-badge-ink:#ffb3dc;--ch-glow:rgba(255,61,154,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
html{background:#14042a}
html,body{margin:0;height:100%;color:#fff;font:16px "Avenir Next Condensed","DIN Condensed","Arial Narrow",ui-rounded,-apple-system,sans-serif;overscroll-behavior:none;font-variant-numeric:tabular-nums}
body{background:radial-gradient(70% 38% at 85% 0%,rgba(255,138,61,.6),transparent 70%),radial-gradient(80% 42% at 0% 18%,rgba(255,45,149,.5),transparent 70%),radial-gradient(90% 40% at 50% 100%,rgba(120,40,200,.45),transparent 70%),linear-gradient(180deg,#14042a,#240a45 60%,#12031f);background-attachment:fixed}
body::before{content:"";position:fixed;left:50%;top:-250px;width:460px;height:460px;margin-left:-230px;border-radius:50%;background:linear-gradient(180deg,#ffd166,#ff5a8a 55%,#b0208f);opacity:.3;-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 15px,transparent 15px 20px);mask-image:repeating-linear-gradient(180deg,#000 0 15px,transparent 15px 20px);pointer-events:none}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 26px 4px}
header h1{font-size:30px;margin:0;text-transform:uppercase;letter-spacing:.06em;font-weight:900}
header.abs{display:none}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 26px 130px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 2px}
.it{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;gap:4px;min-width:64px}
.it b{font-size:12px;color:#fff;font-weight:700;letter-spacing:.02em}
.it small{white-space:nowrap;font-size:11.5px;font-weight:600;color:#ffc4e4}
.it:active .ci{transform:scale(.92)}
.ci{width:50px;height:50px;font-size:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;background:rgba(255,255,255,.1)!important;box-shadow:0 0 0 1.5px var(--g,#ff3d9a),0 0 18px -2px var(--g,#ff3d9a)}
.ci::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:linear-gradient(150deg,rgba(255,255,255,.35),transparent 55%)}
.it:nth-child(4n+2) .ci{--g:#ff8a3d}
.it:nth-child(4n+3) .ci{--g:#2ef2c2}
.it:nth-child(4n) .ci{--g:#b46bff}
.ghost{position:fixed!important;z-index:50;pointer-events:none;transition:none;transform:translate(-50%,-50%) scale(1.15);opacity:.92;filter:drop-shadow(0 18px 18px rgba(40,50,140,.35))}
nav{position:fixed;left:16px;right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:6px;gap:4px;border-radius:28px;-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);z-index:10;background:rgba(24,6,44,.8);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 40px -14px rgba(255,45,149,.45)}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;border-radius:22px;padding:8px 0 7px;font-size:11px;font-weight:700;gap:3px;color:#c9a6e6;transition:background .3s,color .3s,transform .2s}
nav button span{font-size:22px}
nav button:active{transform:scale(.94)}
nav button.on{background:linear-gradient(135deg,#ff3d9a,#ff8a3d);color:#fff;box-shadow:0 8px 20px -8px rgba(255,61,154,.9)}
.card{margin-bottom:12px;padding:14px 6px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);box-shadow:0 22px 50px -24px rgba(255,45,149,.55),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);animation:rise .55s cubic-bezier(.2,.9,.25,1) both}
.card+h2+.card{animation-delay:.06s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes spin{from{transform:translateY(calc(var(--from)*-1em))}to{transform:translateY(calc(var(--to)*-1em))}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}}
@keyframes snow{to{transform:translateY(240px)}}
@keyframes twk{from{opacity:.55}to{opacity:1}}
h2,.day{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#ffb3dc;font-weight:800;margin:24px 10px 10px}
.day{margin-top:22px}
.hh{display:flex;justify-content:space-between;align-items:center}
.hh .p,.hh .m{font-size:15px;font-weight:700;padding:4px 11px;border-radius:999px}
.hh .m{background:rgba(255,106,92,.2);color:#ffa89e}
.hh .p{background:rgba(46,242,194,.18);color:#2ef2c2}
.sw{position:relative;overflow:hidden;border-radius:20px;margin-bottom:8px;background:transparent}
.sw .d{position:absolute;right:20px;top:0;bottom:0;display:none;align-items:center;color:#fff;font-weight:600}
.sw.sp{background:var(--red)}
.sw.sp .d{display:flex}
.rw{position:relative;display:flex;align-items:center;gap:12px;touch-action:pan-y;transition:transform .2s;border-radius:20px;padding:12px 14px;cursor:pointer;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.rw:active{background:rgba(255,255,255,.14)}
.rw .ci{width:40px;height:40px;font-size:19px;background:rgba(255,255,255,.1)!important;box-shadow:none}
.rw div.t{flex:1;min-width:0}
.rw div.t b{display:block;font-weight:500}
.rw div.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9a6e6}
.amt{font-weight:700}
.amt.p{color:#2ef2c2}
.amt.tr{color:#ff8ac4}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(10,2,24,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ov.on{display:flex}
.sh{width:100%;max-height:92%;overflow-y:auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out;border-radius:32px 32px 0 0;background:#1d0839;box-shadow:0 -20px 60px -10px rgba(255,45,149,.45);border-top:1px solid rgba(255,255,255,.18)}
.grab{width:42px;height:5px;border-radius:3px;margin:0 auto 12px;background:rgba(255,255,255,.25)}
.disp{text-align:right;overflow:hidden;font-size:58px;font-weight:700;letter-spacing:-.03em;min-height:72px;color:#fff;text-shadow:0 0 20px rgba(255,61,154,.7)}
.note,.inp{width:100%;background:rgba(255,255,255,.1);border:0;border-radius:16px;color:#fff;color-scheme:dark;padding:12px;font-size:16px;margin:6px 0 10px;-webkit-user-select:text;user-select:text}
.note::placeholder,.inp::placeholder{color:#b894d6}
input{-webkit-user-select:text;user-select:text}
.go{width:100%;border:0;color:#fff;font-weight:600;margin-top:10px;height:58px;border-radius:20px;background:linear-gradient(135deg,#ff3d9a,#ff8a3d 75%);font-size:18px;letter-spacing:.01em;box-shadow:0 16px 28px -12px rgba(90,80,255,.8)}
.go:active{transform:scale(.98)}
.btn{width:100%;padding:14px;border:0;color:#fff;font-size:16px;font-weight:600;margin:6px 0;border-radius:18px;background:linear-gradient(135deg,#ff3d9a,#ff8a3d);box-shadow:0 14px 28px -12px rgba(255,61,154,.9)}
.btn.g{background:rgba(255,255,255,.1);color:#ff8ac4;box-shadow:none}
.st{color:var(--mut);font-size:14px;margin:8px 2px}
.leg{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:15px;font-weight:500}
.ch-summary .leg>span{font-size:15px;letter-spacing:.02em;text-transform:none;font-weight:800;color:var(--ch-mut)}
.ch-summary .leg>b{font-size:18px;font-weight:800}
.leg span{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;border-radius:999px;padding:11px 20px;font-weight:600;box-shadow:0 14px 30px -10px rgba(18,20,43,.5);background:rgba(255,61,154,.95);color:#fff}
.toast.on{opacity:1}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 10px}
.ic{height:46px;border-radius:12px;border:0;background:var(--c2);font-size:24px}
.ic.on{background:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:50px 20px;font-weight:500}
.periodbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin:10px 0 6px}
.periodbar button{border:0;background:rgba(255,255,255,.1);border-radius:50%;width:34px;height:34px;padding:0 0 2px;font-size:22px;color:#ff8ac4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.periodbar strong{font-size:17px;font-weight:700;min-width:120px;text-align:center;text-transform:capitalize;color:#fff}
.periodbar .seg{flex:0 0 100%;display:flex;flex-wrap:nowrap;gap:4px;justify-content:center;padding:2px 0 4px}
.periodbar .seg button{width:auto;height:auto;flex:1 1 auto;min-width:0;padding:5px 3px;border-radius:999px;font-weight:700;font-size:15px!important;line-height:1.1;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.1);color:#e6c8f3;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:background .25s,color .25s,transform .15s}
.periodbar .seg button:active{transform:scale(.95)}
.periodbar .seg button.on{background:linear-gradient(135deg,#ff3d9a,#ff8a3d);color:#fff;box-shadow:0 8px 18px -8px rgba(255,61,154,.9)}
.hero2{margin:12px 0 4px;padding:22px 22px 20px;border-radius:30px;animation:rise .55s cubic-bezier(.2,.9,.25,1) both;position:relative;cursor:pointer;transition:transform .2s;background:linear-gradient(135deg,rgba(255,61,154,.38),rgba(255,138,61,.26) 60%,rgba(120,40,200,.3));border:1px solid rgba(255,255,255,.28);box-shadow:0 26px 60px -22px rgba(255,61,154,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.hero2:active{transform:scale(.985)}
.hero2 small{font-size:12px;text-transform:uppercase;color:#ffd0e8;letter-spacing:.22em;font-weight:800}
.hero2 .hint{position:absolute;top:20px;right:22px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffd0e8;opacity:.85}
.big{display:flex;align-items:flex-end;margin-top:12px;letter-spacing:-.02em;line-height:1;white-space:nowrap;color:#fff;font-weight:900;text-shadow:0 0 28px rgba(255,61,154,.85),0 0 4px rgba(255,255,255,.5)}
.dg{display:inline-block;width:.64em;height:1em;overflow:hidden;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.rl{display:flex;flex-direction:column;will-change:transform}
.rl i{display:block;font-style:normal;height:1em;line-height:1em}
.big .sp{display:inline-block;width:.3em}
.sg{display:inline-block;line-height:1em}
.cur{font-size:.42em;font-weight:700;margin:0 0 .18em .3em;color:#ffb347}
#ov.glassov{align-items:center;justify-content:center;padding:22px;background:rgba(10,2,30,.28);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#ov.glassov .sh{width:100%;max-width:360px;max-height:80%;border-radius:34px;padding:22px 18px 18px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);border:1px solid rgba(255,255,255,.34);box-shadow:0 30px 80px -20px rgba(255,45,149,.6),inset 0 1px 0 rgba(255,255,255,.4);animation:pop .35s cubic-bezier(.2,.9,.3,1.15) both}
#ov.glassov .grab{display:none}
.actl{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#ffd0e8;margin:0 4px}
.actot{color:#fff;text-shadow:0 0 24px rgba(255,61,154,.8);font-size:34px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;margin:2px 4px 14px}
.acr{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:10px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);touch-action:none;cursor:grab;transition:transform .2s,box-shadow .2s,opacity .2s}
.acr .ci{flex:none;width:42px;height:42px;font-size:20px}
.acr .nm{flex:1;color:#fff;font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acr .bl{color:#fff;font-size:16px;font-weight:700;white-space:nowrap}
.acr.lift{opacity:.35}
.acr.hot{transform:scale(1.03);border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 28px 2px var(--acc)}
.rub{font-size:.72em;font-weight:700;margin-left:.28em;color:#ffb3dc}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.tm{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:8px;border-radius:16px;border:1.5px solid transparent;background:rgba(255,255,255,.08);color:#fff;font:700 12.5px -apple-system,sans-serif}
.tm i{display:block;width:100%;height:46px;border-radius:12px}
.tm.on{border-color:#fff;box-shadow:0 0 22px -4px rgba(255,255,255,.45)}
.tm i.swny{display:flex;align-items:center;justify-content:center;font-size:25px;font-style:normal;background:radial-gradient(circle at 16% 26%,#fff 0 1.6px,transparent 2.4px),radial-gradient(circle at 80% 20%,#fff 0 1.3px,transparent 2.1px),radial-gradient(circle at 64% 80%,#fff 0 1.5px,transparent 2.3px),radial-gradient(circle at 28% 78%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 90% 70%,#ffd166 0 1.6px,transparent 2.4px),linear-gradient(150deg,#0a2236,#0e6b5c 60%,#b4232f)}

/* Themes */
html[data-theme=gta]{--k0:#ff3d9a;--k1:#ff8a3d;--k2:#2ef2c2;--k3:#b46bff;--k4:#ffd166;--k5:#4cc9f0;--k6:#ff6a5c;--k7:#9b5de5}

html[data-theme=ny]{--acc:#e63946;--mut:#bfe3dc;--grn:#5ee6a8;--red:#ff7a7a;--c1:rgba(255,255,255,.07);--c2:rgba(255,255,255,.1);--k0:#e63946;--k1:#ffd166;--k2:#3ddc97;--k3:#8fd3ff;--k4:#f4a259;--k5:#ff8fa3;--k6:#2ec4b6;--k7:#c8a2ff;--ch-mut:#bfe3dc;--ch-badge-bg:rgba(230,57,70,.3);--ch-badge-ink:#ffc2c7;--ch-glow:rgba(255,209,102,.3);--ch-track:rgba(255,255,255,.12);background:#06182a}
html[data-theme=ny] body{background:radial-gradient(70% 38% at 85% 0%,rgba(230,57,70,.45),transparent 70%),radial-gradient(80% 42% at 0% 22%,rgba(255,209,102,.22),transparent 70%),radial-gradient(90% 45% at 50% 100%,rgba(14,107,92,.6),transparent 70%),linear-gradient(180deg,#06182a,#0b2a3c 55%,#07251f);background-attachment:fixed}
html[data-theme=ny] body::before{left:0;top:-240px;width:100%;height:calc(100% + 240px);margin:0;border-radius:0;opacity:1;-webkit-mask-image:none;mask-image:none;background:radial-gradient(2.5px 2.5px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 60%,rgba(255,255,255,.9),transparent),radial-gradient(3px 3px at 70% 30%,#fff,transparent),radial-gradient(2px 2px at 85% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 25% 85%,#fff,transparent),radial-gradient(2.5px 2.5px at 55% 10%,#fff,transparent);background-size:240px 240px;animation:snow 10s linear infinite}
html[data-theme=ny] body::after{content:"";position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:28px;z-index:2;pointer-events:none;background:radial-gradient(circle at 15px 15px,#ff4d5a 0 4.5px,transparent 5.5px),radial-gradient(circle at 45px 19px,#ffd166 0 4.5px,transparent 5.5px),radial-gradient(circle at 75px 15px,#3ddc97 0 4.5px,transparent 5.5px),radial-gradient(circle at 105px 19px,#8fd3ff 0 4.5px,transparent 5.5px),linear-gradient(transparent 6px,rgba(255,255,255,.35) 6px 7px,transparent 7px);background-size:120px 28px;filter:drop-shadow(0 0 5px rgba(255,220,150,.8));animation:twk 1.8s ease-in-out infinite alternate}
html[data-theme=ny] h2,html[data-theme=ny] .day,html[data-theme=ny] .actl{color:#ffd98a}
html[data-theme=ny] .card{border-color:rgba(255,255,255,.18);box-shadow:0 22px 50px -24px rgba(14,107,92,.8),inset 0 1px 0 rgba(255,255,255,.12)}
html[data-theme=ny] .hero2{background:linear-gradient(135deg,rgba(230,57,70,.52),rgba(255,209,102,.2) 65%,rgba(14,107,92,.38));border-color:rgba(255,225,160,.5);box-shadow:0 26px 60px -22px rgba(230,57,70,.75),inset 0 1px 0 rgba(255,255,255,.25)}
html[data-theme=ny] .hero2 small,html[data-theme=ny] .hero2 .hint{color:#ffe3a3}
html[data-theme=ny] .actot,html[data-theme=ny] .disp{text-shadow:0 0 26px rgba(255,209,102,.7),0 0 3px rgba(255,255,255,.5)}
html[data-theme=ny] .big{text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,209,102,.6))}
html[data-theme=ny] main{padding-top:24px}
html[data-theme=ny] .cur,html[data-theme=ny] .rub{color:#ffd166}
html[data-theme=ny] .it small,html[data-theme=ny] .rw div.t small{color:#cdeee6}
html[data-theme=ny] .ci{box-shadow:0 0 0 1.5px var(--g,#e63946),0 0 16px -2px var(--g,#e63946)}
html[data-theme=ny] .it:nth-child(4n+2) .ci{--g:#ffd166}

html[data-theme=ny] .it:nth-child(4n) .ci{--g:#8fd3ff}
html[data-theme=ny] .hh .m{background:rgba(230,57,70,.28);color:#ffb3b8}
html[data-theme=ny] .hh .p{background:rgba(94,230,168,.2);color:#5ee6a8}
html[data-theme=ny] .periodbar button{color:#ffd98a}
html[data-theme=ny] .periodbar .seg button{background:rgba(255,255,255,.1);color:#cdeee6;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
html[data-theme=ny] .periodbar .seg button.on,html[data-theme=ny] nav button.on,html[data-theme=ny] .btn,html[data-theme=ny] .go{background:linear-gradient(135deg,#e63946,#f4a259);color:#fff;box-shadow:0 12px 24px -10px rgba(230,57,70,.9)}

html[data-theme=ny] .btn.g{background:rgba(255,255,255,.1);color:#ffd98a;box-shadow:none}

html[data-theme=ny] .amt.tr{color:#ffd98a}
html[data-theme=ny] .toast{background:rgba(230,57,70,.95)}
html[data-theme=ny] #ov.glassov .sh{box-shadow:0 30px 80px -20px rgba(230,57,70,.6),inset 0 1px 0 rgba(255,255,255,.4)}

/* Chart */
.ch-chart-card{margin:10px 0 24px;padding:20px 17px 18px;border-radius:26px;position:relative;overflow:hidden}
.ch-chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.ch-eyebrow{display:block;font-size:15px;letter-spacing:.02em;text-transform:none;font-weight:800;color:var(--ch-mut);margin-bottom:2px}
.ch-chart-head h3{margin:0;color:var(--ch-ink);font-size:18px;letter-spacing:-.4px;font-weight:760}
.ch-chart-badge{flex:none;padding:6px 10px;border-radius:20px;font-size:10px;font-weight:700;color:var(--ch-badge-ink);background:var(--ch-badge-bg)}
.ch-donut-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:236px;height:236px;margin:6px auto 12px;padding:9px;border-radius:50%;background:var(--ch-ring-bg);box-shadow:inset 0 0 0 1px var(--ch-line)}
.ch-donut{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 12px var(--ch-glow))}
.ch-donut circle{transition:stroke-dasharray .35s ease,stroke-dashoffset .35s ease}
.ch-track{stroke:var(--ch-track)}
.ch-donut-center{position:absolute;inset:23%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:var(--ch-center-bg);box-shadow:inset 0 0 0 1px var(--ch-line)}
.ch-donut-center span{color:var(--ch-mut);font-size:9px;font-weight:800;letter-spacing:1.5px;margin-bottom:4px}
.ch-donut-center b{color:var(--ch-ink);font-size:25px;line-height:1.1;font-weight:780;letter-spacing:-.8px;max-width:92%;white-space:nowrap;text-shadow:none}
.ch-donut-center small{color:var(--ch-mut);font-size:11px;margin-top:4px}
.ch-legend{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ch-legend-row{display:flex;align-items:flex-start;gap:10px;min-width:0;padding:10px 11px;border-radius:15px;background:var(--ch-row-bg);box-shadow:inset 0 0 0 1px var(--ch-line)}
.ch-dot{width:11px;height:11px;border-radius:50%;background:var(--dot);flex:none;margin-top:4px;box-shadow:0 0 0 4px color-mix(in srgb,var(--dot) 18%,transparent)}
.ch-legend-main{flex:1;min-width:0}
.ch-legend-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch-legend-top b{color:var(--ch-ink);font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-legend-top strong{color:var(--ch-ink);font-size:13px;font-weight:750;white-space:nowrap}
.ch-legend-bottom{display:flex;align-items:center;gap:9px;margin-top:5px}
.ch-legend-bottom span{color:var(--ch-mut);font-size:10px;font-weight:650;min-width:38px}
.ch-legend-bottom i{height:5px;flex:1;border-radius:10px;overflow:hidden;background:var(--ch-bar-bg)}
.ch-legend-bottom em{display:block;height:100%;border-radius:10px;min-width:2px}

/* Transaction sheet */
.tx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.tx-badge{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);min-width:0}
.tx-badge-ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(255,255,255,.14);flex:none}
.tx-badge-txt{display:flex;flex-direction:column;min-width:0}
.tx-badge-txt small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);line-height:1.1}
.tx-badge-txt b{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tx-close{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--mut);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.tx-close:active{transform:scale(.9)}
.tx-amt-box{position:relative;padding:14px 16px 12px;border-radius:22px;margin-bottom:12px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.tx-amt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tx-amt-lbl,.tx-sec-lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tx-sec-lbl{margin:0 4px 7px;display:flex;justify-content:space-between;align-items:center}
.tx-date-pill{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:700;cursor:pointer}

<div id="app">

<div class="ov" id="ov"><div class="sh" id="sh"></div></div>

<script>
const $=s=>document.querySelector(s),K='okb_v1',RING=['#ff3d9a','#ff8a3d','#2ef2c2','#b46bff'];
const DEF={
 acc:[{id:'a1',n:'Наличные',i:'💵',b:0},{id:'a2',n:'Карта',i:'💳',b:0},{id:'a3',n:'Вклады',i:'🏦',b:0}],
 inc:[{id:'i1',n:'Зарплата',i:'💼'},{id:'i2',n:'Фриланс',i:'💻'},{id:'i3',n:'Подарки',i:'🎁'},{id:'i4',n:'Проценты',i:'📈'}],
 exp:[{id:'e1',n:'Продукты',i:'🛒'},{id:'e2',n:'Кафе',i:'☕'},{id:'e3',n:'Транспорт',i:'🚌'},{id:'e4',n:'Жилье',i:'🏠'},{id:'e5',n:'Развлечения',i:'🎬'},{id:'e6',n:'Здоровье',i:'💊'},{id:'e7',n:'Одежда',i:'👕'},{id:'e8',n:'Прочее',i:'📦'}],
 tx:[],cfg:{last:null,theme:'gta'}
};
const cloneDef=()=>JSON.parse(JSON.stringify(DEF));
let S;
try{const r=JSON.parse(localStorage.getItem(K));S=r&&typeof r==='object'?{...cloneDef(),...r,cfg:{...DEF.cfg,...(r.cfg||{})}}:cloneDef()}catch{S=cloneDef()}

let tab='home',spinNext=true,spinFrom=null,statMode='month',toastT;
let histMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
let statMonth=new Date(histMonth);

const monthName=d=>d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).replace(/\s?г\.?$/,'');
const monthBounds=d=>({start:new Date(d.getFullYear(),d.getMonth(),1).getTime(),end:new Date(d.getFullYear(),d.getMonth()+1,1).getTime()});
const periodBounds=(m,d)=>{
 if(m==='month')return monthBounds(d);
 if(m==='all')return {start:-Infinity,end:Infinity};
 const now=new Date(),end=new Date(now.getFullYear(),now.getMonth()+1,1),start=new Date(end);
 if(m==='3m')start.setMonth(start.getMonth()-3);
 else if(m==='6m')start.setMonth(start.getMonth()-6);
 else if(m==='year')start.setFullYear(now.getFullYear(),0,1);
 return {start:start.getTime(),end:end.getTime()};
};
const periodLabel=m=>({month:'Месяц','3m':'3 месяца','6m':'6 месяцев',year:'Этот год',all:'Всё время'}[m]);
const f=n=>Math.round(n).toLocaleString('ru-RU');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find=(t,id)=>S[t].find(x=>x.id===id)||{n:'?',i:'•'};
const bal=a=>S.tx.reduce((s,x)=>x.t==='trf'?s+(x.c===a.id?x.m:0)-(x.a===a.id?x.m:0):x.a!==a.id?s:s+(x.t==='inc'?x.m:-x.m),a.b||0);
const totalBal=()=>S.acc.reduce((r,a)=>r+bal(a),0);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)};
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch{toast('Ошибка сохранения')}};
const save=()=>{persist();render()};

function ev(expr){
 const clean=String(expr||'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');
 if(!clean||!/^[\d.+\-*/]+$/.test(clean))return NaN;
 const tk=[];let num='';
 for(let i=0;i<clean.length;i++){
  const ch=clean[i],prev=tk[tk.length-1];
  if((ch==='+'||ch==='-')&&(i===0||typeof prev==='string')){num+=ch;continue}
  if(/[\d.]/.test(ch)){num+=ch;continue}
  if(!num)return NaN;
  tk.push(Number(num),ch);num='';
 }
 if(!num)return NaN;
 tk.push(Number(num));
 if(tk.some(x=>typeof x==='number'&&!Number.isFinite(x)))return NaN;
 let p=0;
 const mul=()=>{
  let v=tk[p++];
  while(p<tk.length&&(tk[p]==='*'||tk[p]==='/')){
   const op=tk[p++],r=tk[p++];
   if(op==='*')v*=r;else{if(r===0)return NaN;v/=r}
  }
  return v;
 };
 let res=mul();
 if(Number.isNaN(res))return NaN;
 while(p<tk.length){const op=tk[p++],r=mul();if(Number.isNaN(r))return NaN;res=op==='+'?res+r:res-r}
 return Math.round(res*100)/100;
}

function applyTheme(){
 const t=S.cfg.theme||'gta';document.documentElement.dataset.theme=t;
 const m=document.querySelector('meta[name=theme-color]');
 if(m)m.content={ny:'#06182a',sber:'#f4f7f4',classic:'#0a0b0f',gta:'#14042a'}[t]||'#14042a';
}

function render(){
 document.querySelector('header').classList.toggle('abs',tab==='home');
 $('#ttl').textContent={home:'',hist:'История',stat:'Аналитика',set:'Настройки'}[tab];
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 ({home,hist,stat,set:setg})[tab]();
}

const openOv=(h,glass)=>{$('#ov').classList.toggle('glassov',!!glass);$('#sh').innerHTML='<div class="grab"></div>'+h;$('#ov').classList.add('on')};
const closeOv=()=>$('#ov').classList.remove('on','glassov');
$('#ov').onclick=e=>{if(e.target.id==='ov')closeOv()};

function openAccounts(){
 openOv(`<div class="actl">Мои счета</div><div class="actot">${f(totalBal())}<span class="rub">₸</span></div>`+
  S.acc.map((a,i)=>`<div class="acr" data-a="${a.id}"><div class="ci" style="--g:${RING[i%4]}">${a.i}</div><div class="nm">${esc(a.n)}</div><div class="bl">${f(bal(a))}<span class="rub">₸</span></div></div>`).join(''),true);
 document.querySelectorAll('.acr').forEach(row=>{
  row.onpointerdown=e=>{
   const x0=e.clientX,y0=e.clientY;let gh=null,tg=null;row.setPointerCapture(e.pointerId);
   row.onpointermove=m=>{
    if(!gh&&Math.hypot(m.clientX-x0,m.clientY-y0)>8){
     gh=row.querySelector('.ci').cloneNode(true);gh.classList.add('ghost');document.body.appendChild(gh);
     row.classList.add('lift');navigator.vibrate&&navigator.vibrate(10);
    }
    if(!gh)return;
    gh.style.left=m.clientX+'px';gh.style.top=m.clientY+'px';
    const hit=document.elementFromPoint(m.clientX,m.clientY),n=hit&&hit.closest('.acr'),nn=n&&n!==row?n:null;
    if(nn!==tg){tg&&tg.classList.remove('hot');tg=nn;tg&&tg.classList.add('hot')}
   };
   row.onpointerup=row.onpointercancel=u=>{
    row.onpointermove=row.onpointerup=row.onpointercancel=null;
    if(gh){
     gh.remove();row.classList.remove('lift');tg&&tg.classList.remove('hot');
     if(tg&&u.type==='pointerup'){const a=row.dataset.a,o=tg.dataset.a;closeOv();openSheet('trf',a,o)}
    }
   };
  };
 });
}

function reels(str,spin,prev){
 let k=0;const dg=str.replace(/\D/g,''),pd=(prev||'').replace(/\D/g,'');
 return str.split('').map(ch=>{
  if(ch.trim()==='')return '<span class="sp"></span>';
  if(!/\d/.test(ch))return `<span class="sg">${ch}</span>`;
  const d=+ch,i=k++,up=i%2===0,p=+(pd[pd.length-dg.length+i]||0),to=up?20+d:10+d,from=up?p:30+p;
  const anim=spin?`animation:spin ${(1.1+i*.13).toFixed(2)}s cubic-bezier(.2,.85,.25,1.05) ${((prev?.04:.2)+i*.1).toFixed(2)}s both`:`transform:translateY(calc(${to}*-1em))`;
  return `<span class="dg"><span class="rl" style="--from:${from};--to:${to};${anim}">${Array.from({length:40},(_,n)=>`<i>${n%10}</i>`).join('')}</span></span>`;
 }).join('');
}

function home(){
 const {start:ms,end:me}=monthBounds(new Date());
 const monthTx=S.tx.filter(x=>x.ts>=ms&&x.ts<me);
 const sum=(t,c)=>monthTx.filter(x=>x.t===t&&(!c||x.c===c)).reduce((r,x)=>r+x.m,0);
 const grid=t=>S[t].map(c=>`<div class="it" data-cat="${c.id}" data-t="${t}"><div class="ci">${c.i}</div><b>${esc(c.n)}</b><small>${f(sum(t,c.id))}</small></div>`).join('');
 const prevFrom=spinFrom;spinFrom=null;
 const txt=f(totalBal()).replace('-','−'),nd=(txt.match(/\d/g)||[]).length,sp=(txt.match(/\s/g)||[]).length;
 const fs=Math.max(30,Math.min(56,Math.floor(300/(nd*.64+sp*.3+.8)))),spin=spinNext;spinNext=false;
 $('#v').innerHTML=`
  <div class="hero2"><small>Всего на счетах</small><span class="hint">Счета ›</span><div class="big" style="font-size:${fs}px" aria-label="${txt} ₸">${reels(txt,spin,prevFrom)}<span class="cur">₸</span></div></div>
  <h2 class="hh"><span>Расходы</span><span class="m">${f(sum('exp'))}</span></h2><div class="card grid">${grid('exp')}</div>
  <h2 class="hh"><span>Доходы</span><span class="p">${f(sum('inc'))}</span></h2><div class="card grid">${grid('inc')}</div>`;
 document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>openSheet(e.dataset.t,S.acc[0].id,e.dataset.cat));
 $('.hero2').onclick=openAccounts;
}

function hist(){
 const {start,end}=monthBounds(histMonth);
 const tx=S.tx.filter(x=>x.ts>=start&&x.ts<end).sort((a,b)=>b.ts-a.ts);
 const bar=`<div class="periodbar"><button id="hpPrev">‹</button><strong>${monthName(histMonth)}</strong><button id="hpNext">›</button></div>`;
 if(!tx.length){$('#v').innerHTML=bar+'<div class="empty">За этот период операций нет.</div>'}
 else{
  const g={};
  tx.forEach(x=>{const k=new Date(x.ts).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long',year:'numeric'});(g[k]=g[k]||[]).push(x)});
  $('#v').innerHTML=bar+Object.entries(g).map(([k,l])=>`<div class="day">${k}</div>`+l.map(x=>{
   const c=x.t==='trf'?{i:'⇄',n:'Перевод'}:find(x.t,x.c);
   const sub=esc(find('acc',x.a).n)+(x.t==='trf'?' → '+esc(find('acc',x.c).n):'');
   return `<div class="sw" data-id="${x.id}"><div class="d">Удалить</div><div class="rw"><div class="ci">${c.i}</div><div class="t"><b>${esc(c.n)}</b><small>${sub}${x.n?' · '+esc(x.n):''}</small></div><div class="amt ${x.t==='inc'?'p':x.t==='trf'?'tr':''}">${x.t==='trf'?'':x.t==='inc'?'+':'−'}${f(x.m)}</div></div></div>`;
  }).join('')).join('');
  document.querySelectorAll('.sw').forEach(swipe);
 }
 $('#hpPrev').onclick=()=>{histMonth.setMonth(histMonth.getMonth()-1);render()};
 $('#hpNext').onclick=()=>{histMonth.setMonth(histMonth.getMonth()+1);render()};
}

function swipe(w){
 const r=w.querySelector('.rw');let x0=0,dx=0,on=0,mv=0;
 r.onpointerdown=e=>{x0=e.clientX;dx=mv=0;on=1;r.style.transition='none';r.setPointerCapture(e.pointerId)};
 r.onpointermove=e=>{if(!on)return;mv=Math.max(mv,Math.abs(e.clientX-x0));dx=Math.min(0,e.clientX-x0);if(dx<-4)w.classList.add('sp');r.style.transform=`translateX(${dx}px)`};
 r.onpointerup=r.onpointercancel=()=>{
  on=0;r.style.transition='';
  if(dx<-90){r.style.transform='translateX(-110%)';setTimeout(()=>{S.tx=S.tx.filter(x=>String(x.id)!==w.dataset.id);save()},180)}
  else{r.style.transform='';setTimeout(()=>w.classList.remove('sp'),220)}
 };
 r.onclick=()=>{if(mv<8){const x=S.tx.find(q=>String(q.id)===w.dataset.id);if(x)openSheet(x.t,x.a,x.c,x)}};
}

function stat(){
 const {start,end}=periodBounds(statMode,statMonth);
 const inP=S.tx.filter(x=>x.ts>=start&&x.ts<end);
 const exp=inP.filter(x=>x.t==='exp'),inc=inP.filter(x=>x.t==='inc');
 const tot=exp.reduce((s,x)=>s+x.m,0),income=inc.reduce((s,x)=>s+x.m,0);
 const by=S.exp.map((c,i)=>({c,v:exp.filter(x=>x.c===c.id).reduce((s,x)=>s+x.m,0),k:`var(--k${i%8})`})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 const incBy=S.inc.map((c,i)=>({c,v:inc.filter(x=>x.c===c.id).reduce((s,x)=>s+x.m,0),col:RING[i%4]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 const circ=238.76,gap=by.length>1?2.8:0;let off=0;
 const seg=tot?by.map(x=>{
  const pct=x.v/tot*100,len=pct/100*circ,s1=by.length===1?circ:Math.max(len-gap,.6);
  const n=`<circle r="38" cx="50" cy="50" fill="none" style="stroke:${x.k}" stroke-width="9" stroke-linecap="butt" stroke-dasharray="${s1} ${circ-s1}" stroke-dashoffset="${-(off/100*circ+gap/2)}" transform="rotate(-90 50 50)"/>`;
  off+=pct;return n;
 }).join(''):'';
 const title=statMode==='month'?monthName(statMonth):periodLabel(statMode);
 const nav=statMode==='month'?`<button id="spPrev">‹</button><strong>${title}</strong><button id="spNext">›</button>`:`<button style="visibility:hidden" tabindex="-1">‹</button><strong>${title}</strong><button style="visibility:hidden" tabindex="-1">›</button>`;
 const selector=`<div class="periodbar">${nav}<div class="seg">${[['month','Месяц'],['3m','3 мес'],['6m','6 мес'],['year','Год'],['all','Всё']].map(([v,l])=>`<button data-m="${v}" class="${statMode===v?'on':''}">${l}</button>`).join('')}</div></div>`;
 const ct=f(tot),cd=(ct.match(/\d/g)||[]).length,cw=(ct.match(/\s/g)||[]).length,cfs=Math.max(11,Math.min(25,Math.floor(90/(cd*.58+cw*.3+.01))));
 const chart=by.length?`
  <div class="card ch-chart-card">
   <div class="ch-chart-head"><span class="ch-eyebrow">Структура расходов</span><span class="ch-chart-badge">${by.length} ${by.length===1?'категория':by.length<5?'категории':'категорий'}</span></div>
   <div class="ch-donut-wrap"><svg class="ch-donut" viewBox="0 0 100 100" role="img" aria-label="Круговая диаграмма расходов"><circle cx="50" cy="50" r="38" fill="none" class="ch-track" stroke-width="9"/>${seg}</svg><div class="ch-donut-center"><span>ВСЕГО</span><b style="font-size:${cfs}px">${ct}</b><small>расходов</small></div></div>
   <div class="ch-legend">${by.map(x=>{const pct=x.v/tot*100;return `<div class="ch-legend-row"><span class="ch-dot" style="--dot:${x.k}"></span><div class="ch-legend-main"><div class="ch-legend-top"><b>${esc(x.c.n)}</b><strong>${f(x.v)}</strong></div><div class="ch-legend-bottom"><span>${pct.toFixed(1).replace('.',',')}%</span><i><em style="width:${pct}%;background:${x.k}"></em></i></div></div></div>`}).join('')}</div>
  </div>`:`<div class="card ch-chart-card"><div class="ch-chart-head"><span class="ch-eyebrow">Структура расходов</span></div><div class="empty">За этот период расходов нет</div></div>`;
 $('#v').innerHTML=selector+`<div class="card ch-summary" id="incSummary" style="cursor:pointer"><div class="leg"><span>Доходы</span><b class="amt p">${f(income)} ›</b></div></div>`+chart;
 $('#incSummary').onclick=()=>openOv(`<div class="actl">Доходы · ${esc(title)}</div><div class="actot">${f(income)}<span class="rub">₸</span></div>`+(incBy.length?incBy.map(x=>`<div class="acr"><div class="ci" style="--g:${x.col}">${x.c.i}</div><div class="nm">${esc(x.c.n)}</div><div class="bl amt p">${f(x.v)}<span class="rub">₸</span></div></div>`).join(''):'<div class="empty" style="padding:24px 12px">За этот период доходов нет.</div>'),true);
 document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{statMode=b.dataset.m;render()});
 if($('#spPrev'))$('#spPrev').onclick=()=>{statMonth.setMonth(statMonth.getMonth()-1);render()};
 if($('#spNext'))$('#spNext').onclick=()=>{statMonth.setMonth(statMonth.getMonth()+1);render()};
}

function fmtShortDate(iso){
 const [y,m,d]=iso.split('-').map(Number),dt=new Date(y,m-1,d),now=new Date();
 const diff=Math.round((dt-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
 if(diff===0)return 'Сегодня';if(diff===-1)return 'Вчера';if(diff===1)return 'Завтра';
 return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short',...(y!==now.getFullYear()?{year:'numeric'}:{})}).replace(/\.?$/,'');
}

function openSheet(t,a,c,tx){
 const d0=tx?new Date(tx.ts):new Date(),ds=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}`;
 const sh={t,a,c,e:tx?String(tx.m):'',n:tx?(tx.n||''):'',id:tx&&tx.id,fresh:!!tx,date:ds,date0:ds};
 const cat=t==='trf'?find('acc',c):find(t,c);
 const accCards=id=>S.acc.map(x=>`<button type="button" class="tx-acc ${x.id===id?'on':''}" data-a="${x.id}"><span class="tx-acc-ic">${x.i}</span><span class="tx-acc-info"><b>${esc(x.n)}</b><small>${f(bal(x))} ₸</small></span></button>`).join('');
 openOv(`
  <div class="tx-head">
   <div class="tx-badge"><span class="tx-badge-ic">${t==='trf'?'⇄':cat.i}</span><span class="tx-badge-txt"><small>${sh.id?'Изменить · ':''}${t==='trf'?'Перевод':t==='exp'?'Расход':'Доход'}</small><b>${t==='trf'?'Между счетами':esc(cat.n)}</b></span></div>
   <button type="button" class="tx-close" id="txClose" aria-label="Закрыть">✕</button>
  </div>
  <div class="tx-amt-box">
   <div class="tx-amt-top"><span class="tx-amt-lbl">Сумма</span><label class="tx-date-pill">📅 <span id="txDateTxt">${fmtShortDate(sh.date)}</span><input id="txDate" type="date" value="${sh.date}"></label></div>
   <div class="tx-disp-row"><div class="disp" id="disp">0</div><span class="tx-disp-cur">₸</span></div>
   <div class="tx-calc-hint" id="calcHint"></div>
  </div>
  <div class="tx-sec-lbl"><span>${t==='trf'?'Счёт списания':'Счёт'}</span></div>
  <div class="tx-acc-row" id="chips">${accCards(a)}</div>
  ${t==='trf'?`<div class="tx-sec-lbl"><span>Счёт зачисления</span></div><div class="tx-acc-row" id="chips2">${accCards(c)}</div>`:''}
  <div class="tx-note-wrap"><span class="tx-note-ic">✎</span><input class="note" id="note" placeholder="Комментарий (необязательно)" maxlength="80"></div>
  <div class="tx-pad">${['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+'].map(k=>`<button type="button" class="${'÷×−+'.includes(k)?'o':k==='⌫'?'bk':''}" data-k="${k}">${k}</button>`).join('')}</div>
  <button type="button" class="tx-go" id="go">${sh.id?'Сохранить изменения':t==='exp'?'Добавить расход':t==='inc'?'Добавить доход':'Перевести'}</button>`);
 const bindAcc=(sel,key)=>{const el=$(sel);if(el)el.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;sh[key]=b.dataset.a;el.querySelectorAll('.tx-acc').forEach(x=>x.classList.toggle('on',x===b))}};
 bindAcc('#chips','a');bindAcc('#chips2','c');
 $('#txClose').onclick=closeOv;
 $('#note').value=sh.n;$('#note').oninput=e=>sh.n=e.target.value;
 $('#txDate').onchange=e=>{sh.date=e.target.value||sh.date;$('#txDateTxt').textContent=fmtShortDate(sh.date)};
 const updDisp=()=>{
  const raw=sh.e.replace(/-/g,'−')||'0',nd=raw.replace(/\D/g,'').length,v=ev(sh.e);
  $('#disp').textContent=raw;$('#disp').style.fontSize=(nd>11?32:nd>8?38:48)+'px';
  $('#calcHint').textContent=/[+\-×÷]/.test(sh.e.slice(1))&&!Number.isNaN(v)?`= ${f(v)} ₸`:'';
 };
 updDisp();
 document.querySelectorAll('.tx-pad button').forEach(b=>b.onpointerdown=e=>{
  e.preventDefault();const k=b.dataset.k;
  if(sh.fresh){if(/[\d.]/.test(k))sh.e='';sh.fresh=false}
  sh.e=k==='⌫'?sh.e.slice(0,-1):sh.e+(k==='−'?'-':k);
  updDisp();
 });
 $('#go').onclick=()=>{
  const v=ev(sh.e);
  if(!(v>0)){toast('Введите сумму');return}
  if(sh.t==='trf'&&sh.a===sh.c){toast('Выберите разные счета');return}
  sh.date=$('#txDate').value||sh.date;
  const [y,m,d]=sh.date.split('-').map(Number),ts=new Date(y,m-1,d,12).getTime(),oldTxt=f(totalBal()).replace('-','−');
  if(sh.id){const x=S.tx.find(q=>q.id===sh.id);if(x){x.a=sh.a;if(sh.t==='trf')x.c=sh.c;x.m=v;x.n=sh.n.trim();if(sh.date!==sh.date0)x.ts=ts}}
  else S.tx.push({id:Date.now(),t:sh.t,a:sh.a,c:sh.c,m:v,n:sh.n.trim(),ts});
  if(sh.t!=='trf'&&tab==='home'){spinFrom=oldTxt;spinNext=true}
  closeOv();save();toast('Сохранено');
 };
}

const ICONS=['💵','💳','🏦','👛','💰','🪙','💼','💻','🎁','📈','🏠','🛒','🍎','🍽️','☕','🍺','🚌','🚗','⛽','🚕','✈️','🏨','🎬','🎮','🎵','📚','🎓','💊','🏥','🦷','👕','👟','💄','✂️','🧴','🐶','🧸','👶','📱','🔌','💡','🧾','🔧','🛠️','🏋️','⚽','🏖️','🎉','🌐','📦','❤️','⭐'];
const NAMES={acc:'счёт',inc:'категория дохода',exp:'категория расхода'};

function setg(){
 const th=S.cfg.theme||'gta';
 $('#v').innerHTML=`
  <h2>Резервная копия</h2><div class="card" style="padding:14px"><button class="btn" id="exp">Скачать данные (файл)</button><button class="btn g" id="imp">Загрузить данные из файла</button><input type="file" id="file" accept=".json,application/json" hidden><div class="st" id="stt"></div></div>
  <h2>Счета и категории</h2><div class="card cats">${[['acc','💳','Счета'],['inc','💰','Доходы'],['exp','🛒','Расходы']].map(([t,ic,n])=>`<button type="button" class="cb" data-w="${t}"><span class="cbi">${ic}</span><b>${n}</b></button>`).join('')}</div>
  <h2>Тема оформления</h2><div class="card themes">
   <button class="tm ${th==='sber'?'on':''}" data-th="sber"><i style="background:linear-gradient(135deg,#21a038,#00c853 58%,#b6ed45)"></i>Светлая</button>
   <button class="tm ${th==='classic'?'on':''}" data-th="classic"><i style="background:linear-gradient(135deg,#1c2140,#4c8dff 70%,#7a5cff)"></i>Тёмная</button>
   <button class="tm ${th==='gta'?'on':''}" data-th="gta"><i style="background:linear-gradient(135deg,#ff3d9a,#ff8a3d 55%,#6a1b9a)"></i>Vice City</button>
   <button class="tm ${th==='ny'?'on':''}" data-th="ny"><i class="swny">🎄</i>❄ Новый год</button>
  </div>`;
 status();
 document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.cfg.theme=b.dataset.th;persist();applyTheme();setg()});
 $('#exp').onclick=exportData;$('#imp').onclick=()=>$('#file').click();$('#file').onchange=importData;
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>openCatWindow(b.dataset.w));
}

function openCatWindow(t){
 openOv(`<div class="cw-head"><b>${{acc:'Счета',inc:'Доходы',exp:'Расходы'}[t]}</b><button type="button" class="tx-close" id="cwClose" aria-label="Закрыть">✕</button></div><div class="card grid cw-grid">${S[t].map(x=>`<div class="it" data-id="${x.id}"><div class="ci">${x.i}</div><b>${esc(x.n)}</b>${t==='acc'?`<small>${f(bal(x))}</small>`:''}</div>`).join('')}<div class="it add"><div class="ci">＋</div><b>Добавить</b></div></div>`);
 $('#cwClose').onclick=closeOv;
 document.querySelectorAll('.cw-grid .it').forEach(e=>e.onclick=()=>openEdit(t,e.classList.contains('add')?null:e.dataset.id));
}

function openEdit(t,id){
 const isNew=!id,o=isNew?{id:t+Date.now(),n:'',i:ICONS[0],b:0}:find(t,id);let ic=o.i;
 const curBal=Math.round(bal(o)*100)/100,txDelta=curBal-(o.b||0);
 openOv(`<h2 style="margin-top:0">${isNew?'Новая':'Изменить'}: ${NAMES[t]}</h2><input class="inp" id="en" placeholder="Название" maxlength="20" value="${esc(o.n)}">
  ${t==='acc'?`<div class="st" style="margin:0 0 -4px">Баланс на счёте (как на главной)</div><input class="inp" id="eb" type="number" inputmode="decimal" placeholder="Баланс счёта" value="${isNew?0:curBal}">`:''}
  <div class="icons">${ICONS.map(i=>`<button class="ic ${i===ic?'on':''}" data-i="${i}">${i}</button>`).join('')}</div>
  <button class="go" id="es">Сохранить</button>${isNew?'':'<button class="btn g" id="ed" style="color:var(--red)">Удалить</button>'}<button class="btn g" id="ec">Назад</button>`);
 const back=()=>{closeOv();render();openCatWindow(t)};
 document.querySelectorAll('.ic').forEach(b=>b.onclick=()=>{ic=b.dataset.i;document.querySelectorAll('.ic').forEach(x=>x.classList.toggle('on',x===b))});
 $('#ec').onclick=back;
 $('#es').onclick=()=>{
  const n=$('#en').value.trim();if(!n){toast('Введите название');return}
  const v={id:o.id,n,i:ic};
  if(t==='acc'){const nv=+$('#eb').value||0;v.b=isNew?nv:Math.round((nv-txDelta)*100)/100}
  if(isNew)S[t].push(v);else Object.assign(o,v);
  save();back();
 };
 if(!isNew)$('#ed').onclick=()=>{
  if(t==='acc'&&S.acc.length<2){toast('Нужен хотя бы один счёт');return}
  const match=x=>t==='acc'?(x.a===id||(x.t==='trf'&&x.c===id)):x.t===t&&x.c===id;
  const k=S.tx.filter(match).length;
  if(!confirm(`Удалить «${o.n}»${k?` вместе с операциями (${k})`:''}?`))return;
  S[t]=S[t].filter(x=>x.id!==id);S.tx=S.tx.filter(x=>!match(x));save();back();
 };
}

const status=()=>{const e=$('#stt');if(e)e.textContent=S.cfg.last?'Последняя копия: '+new Date(S.cfg.last).toLocaleString('ru-RU'):'Копий ещё не было'};
const done=()=>{S.cfg.last=Date.now();persist();status();toast('Файл сохранён')};

async function exportData(){
 const {cfg,...d}=S,blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'}),name='budget_'+new Date().toISOString().slice(0,10)+'.json';
 try{
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});done();return}
 }catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);done();
}

function importData(e){
 const file=e.target.files[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d.acc)||!d.acc.length||!Array.isArray(d.tx)||!Array.isArray(d.inc)||!Array.isArray(d.exp))throw 0;
   if(!confirm(`Заменить текущие данные данными из файла?
Операций в файле: ${d.tx.length}`))return;
   S={...cloneDef(),...d,cfg:{...S.cfg,...(d.cfg||{})}};
   persist();closeOv();applyTheme();render();toast('Данные загружены');
  }catch{toast('Не удалось прочитать файл')}
 };
 r.readAsText(file);e.target.value='';
}

document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==='home')spinNext=true;render();$('#v').scrollTop=0});
try{
 const m={name:'Бюджет',short_name:'Бюджет',display:'standalone',background_color:'#000000',theme_color:'#000000',start_url:location.pathname,lang:'ru',icons:[{src:new URL('icon-512.png',location.href).href,sizes:'512x512',type:'image/png'},{src:new URL('icon-180.png',location.href).href,sizes:'180x180',type:'image/png'}]};
 const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
}catch{}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();
window.addEventListener('pageshow',e=>{if(e.persisted&&tab==='home'){spinNext=true;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='home'&&!$('#ov').classList.contains('on')){spinNext=true;render()}});
</script></body></html>
